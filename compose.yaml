# The servers the integration tests run against (DGOPHER_IT=1). Ports and
# passwords match internal/testutil/testutil.go, internal/db/integration_test.go
# and, for Redis 8, internal/db/redismodules_test.go and
# internal/ui/redis/redis_test.go.
name: dgopher-test

services:
  postgres:
    image: postgres:17
    container_name: dgopher-pg
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_PASSWORD: dgopher
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: dgopher-mysql
    ports: ["127.0.0.1:13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: dgopher
      MYSQL_DATABASE: shop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdgopher"]
      interval: 2s
      retries: 60

  # MariaDB, in the compat profile: docker compose --profile compat up -d
  # --wait mariadb. Its tests skip when it is not running.
  mariadb:
    image: mariadb:11.4
    container_name: dgopher-mariadb
    profiles: ["compat"]
    ports: ["127.0.0.1:13307:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: dgopher
      MARIADB_DATABASE: shop
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  # TiDB, in the compat profile: docker compose --profile compat up -d
  # --wait tidb. One server on its own embedded store (unistore); the first
  # start sets root's password (ALTER USER there leaves it empty; an
  # UPDATE of mysql.user sets it), keeps CHECK constraints, which TiDB
  # ignores by default, and makes the database.
  tidb:
    image: pingcap/tidb:v8.5.1
    container_name: dgopher-tidb
    profiles: ["compat"]
    ports: ["127.0.0.1:14000:4000"]
    entrypoint:
      - sh
      - -c
      - >-
        printf "UPDATE mysql.user SET authentication_string = CONCAT('*', UPPER(SHA1(UNHEX(SHA1('dgopher'))))) WHERE User = 'root';\nFLUSH PRIVILEGES;\nSET GLOBAL tidb_enable_check_constraint = ON;\nCREATE DATABASE IF NOT EXISTS shop;\n" > /tmp/init.sql;
        exec /tidb-server --store=unistore --path=/tmp/tidb --initialize-sql-file=/tmp/init.sql
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:10080/status"]
      interval: 2s
      retries: 60

  # CockroachDB, in the compat profile: docker compose --profile compat up
  # -d --wait cockroachdb. One secure node, so that passwords work, taking
  # them without TLS; the image makes the database, and the user dgopher
  # (an admin) with its password. Healthy once both exist.
  cockroachdb:
    image: cockroachdb/cockroach:latest-v26.3
    container_name: dgopher-cockroachdb
    profiles: ["compat"]
    ports: ["127.0.0.1:26257:26257"]
    command: ["start-single-node", "--accept-sql-without-tls"]
    environment:
      COCKROACH_DATABASE: shop
      COCKROACH_USER: dgopher
      COCKROACH_PASSWORD: dgopher
    healthcheck:
      test: ["CMD", "test", "-f", "/cockroach/init_success"]
      interval: 2s
      retries: 60

  # YugabyteDB, in the compat profile: docker compose --profile compat up
  # -d --wait yugabytedb. One node, which takes about 1.5 GB of memory; the
  # first start turns on passwords, sets yugabyte's and makes the database.
  # Healthy once it logs in there.
  yugabytedb:
    image: yugabytedb/yugabyte:2025.2.8.0-b60
    container_name: dgopher-yugabytedb
    profiles: ["compat"]
    ports: ["127.0.0.1:15433:5433"]
    command: ["bin/yugabyted", "start", "--background=false", "--ui=false"]
    environment:
      YSQL_PASSWORD: dgopher
      YSQL_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=dgopher bin/ysqlsh -h \"$$(hostname)\" -U yugabyte -d shop -c 'SELECT 1'"]
      interval: 2s
      retries: 90

  # TimescaleDB, in the compat profile: docker compose --profile compat up
  # -d --wait timescaledb. The image creates the extension in the database
  # it makes, shop, and in template1. Healthy once it listens on TCP, which
  # the server that runs the image's setup does not.
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: dgopher-timescaledb
    profiles: ["compat"]
    ports: ["127.0.0.1:15434:5432"]
    environment:
      POSTGRES_PASSWORD: dgopher
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shop"]
      interval: 2s
      retries: 30

  # SQL Server 2025 Developer edition, for x86-64 only; it needs about 2 GB
  # of memory. sa's password must meet SQL Server's complexity rules.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dgopher-sqlserver
    profiles: ["enterprise"]
    ports: ["127.0.0.1:11433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Dgopher-1
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "127.0.0.1", "-U", "sa", "-P", "Dgopher-1", "-Q", "IF DB_ID('shop') IS NULL CREATE DATABASE shop; SELECT 1"]
      interval: 3s
      retries: 60

  # Oracle Database 23ai Free (capped at 2 CPU threads and 2 GB of memory).
  # The app user dgopher owns the test schema in the FREEPDB1 service.
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    container_name: dgopher-oracle
    profiles: ["enterprise"]
    ports: ["127.0.0.1:11521:1521"]
    environment:
      ORACLE_PASSWORD: dgopher
      APP_USER: dgopher
      APP_USER_PASSWORD: dgopher
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: dgopher-ch
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:18123:8123"]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dgopher
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "dgopher", "--query", "SELECT 1"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    container_name: dgopher-redis
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Redis 8, with its modules (JSON, Search, TimeSeries, vector sets) and
  # arrays.
  redis8:
    image: redis:8
    container_name: dgopher-redis8
    ports: ["127.0.0.1:16385:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # A cluster of three masters. It uses the host's network, so the
  # addresses the nodes announce are reachable from the tests.
  redis-cluster:
    image: redis:7
    container_name: dgopher-redis-cluster
    network_mode: host
    command:
      - sh
      - -c
      - >-
        for p in 17000 17001 17002; do
        redis-server --port $$p --bind 127.0.0.1 --cluster-enabled yes
        --cluster-config-file nodes-$$p.conf --requirepass dgopher
        --masterauth dgopher --daemonize yes; done;
        sleep 1;
        redis-cli -a dgopher --no-auth-warning --cluster create
        127.0.0.1:17000 127.0.0.1:17001 127.0.0.1:17002 --cluster-yes;
        exec tail -f /dev/null

  # A master on 16380 watched by a sentinel on 26379, also on the host's
  # network.
  redis-sentinel:
    image: redis:7
    container_name: dgopher-redis-sentinel
    network_mode: host
    command:
      - sh
      - -c
      - >-
        redis-server --port 16380 --bind 127.0.0.1 --requirepass dgopher --daemonize yes;
        printf "port 26379\nbind 127.0.0.1\nrequirepass sentinelpw\nsentinel monitor mymaster 127.0.0.1 16380 1\nsentinel auth-pass mymaster dgopher\n" > /tmp/sentinel.conf;
        exec redis-sentinel /tmp/sentinel.conf
