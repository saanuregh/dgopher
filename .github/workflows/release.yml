# A tag v<version>, the version of mygo.json, builds the app on every
# platform it ships for and publishes them as that version's release.
# DuckDB needs cgo, so each platform builds on a runner of its own system.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "DGopher $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { name: Linux arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { name: macOS arm64, os: macos-26, platform: darwin/arm64 }
          - { name: macOS amd64, os: macos-26-intel, platform: darwin/amd64 }
          - { name: Windows amd64, os: windows-latest, platform: windows/amd64 }
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # mygo build downloads NSIS for the Windows installer; go.sum pins it.
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Each file is named for its platform: the disk images of both Macs,
        # for one, are otherwise named alike, and one would replace the other.
        run: |
          platform="$(echo "${{ matrix.platform }}" | tr / -)"
          dir="build/$platform"
          files=()
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            name="${name// /-}"
            case "$name" in
              *amd64* | *arm64*) ;;
              *.tar.gz) name="${name%.tar.gz}-$platform.tar.gz" ;;
              *) name="${name%.*}-$platform.${name##*.}" ;;
            esac
            cp "$f" "$RUNNER_TEMP/$name"
            files+=("$RUNNER_TEMP/$name")
          done < <(find "$dir" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*Setup*.exe' -o -name '*.deb' -o -name '*.tar.gz' \) -print0)
          test "${#files[@]}" -gt 0 || { echo "nothing built in $dir"; ls -la "$dir"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
