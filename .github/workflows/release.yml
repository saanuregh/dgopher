# A tag v<version>, the version of mygo.json, builds the app on every
# platform it ships for and publishes them as that version's release, with
# the signed updates that installed apps download from it.
# DuckDB needs cgo, so each platform builds on a runner of its own system.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # Without the key, mygo build only warns, and the release has no updates.
      - name: Check the update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "set the MYGO_UPDATER_PRIVATE_KEY secret"; exit 1; }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "DGopher $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { name: Linux arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { name: macOS arm64, os: macos-26, platform: darwin/arm64 }
          - { name: macOS amd64, os: macos-26-intel, platform: darwin/amd64 }
          - { name: Windows amd64, os: windows-latest, platform: windows/amd64 }
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # mygo build downloads NSIS for the Windows installer; go.sum pins it.
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Upload the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          rm -f "$dir/SHA256SUMS"
          (cd "$dir" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
