name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1" # DuckDB
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      # Unit and headless UI tests; the integration tests need the servers
      # of docs/development.md, and skip without DGOPHER_IT.
      - name: Test
        run: go test ./...
