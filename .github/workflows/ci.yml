name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    env:
      CGO_ENABLED: "1" # DuckDB
    defaults:
      run:
        shell: bash
    steps:
      # Files keep their LF line ends, as gofmt and the tests expect.
      - name: Keep line ends
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # gofmt, vet, and the unit and headless UI tests; the integration
      # tests need the servers of docs/development.md, and skip without
      # DGOPHER_IT.
      - name: Check
        run: go run ./tools/dev check
